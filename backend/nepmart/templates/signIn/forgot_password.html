{% block content %}
<h3>Forgot Your Password?</h3>
<h5>Enter your username and new password</h5>

<form method="POST">
  {% csrf_token %}

  <input
    class="form-control mb-2"
    type="text"
    name="username"
    placeholder="Username"
    required
  />

  <input
    class="form-control mb-2"
    type="password"
    name="password"
    placeholder="New Password"
    required
  />

  <input
    class="form-control mb-2"
    type="password"
    name="confirm_password"
    placeholder="Confirm Password"
    required
  />

  <button class="btn btn-success">Reset Password</button>
</form>
{% endblock %}
